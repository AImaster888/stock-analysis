<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票分析報告 · aimaster888</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181f; --paper:#ecefe9; --paper-2:#e2e5dd;
    --panel:#1b2130; --panel-2:#242c3f;
    --rise:#b23a2e; --fall:#1f7a5c; --gold:#a9762f;
    --line:#cfd1c6; --muted:#585d55; --muted-light:#9ea299; --paper-text:#f4f2ea;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',-apple-system,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  .masthead{background:var(--panel);color:var(--paper-text);padding:2.6rem 1.5rem 2rem;border-bottom:6px solid var(--gold);}
  .masthead-inner{max-width:920px;margin:0 auto;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:.9rem;}
  .masthead h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2rem,5vw,3rem);margin:0 0 .6rem;letter-spacing:-.01em;}
  .masthead p{color:var(--muted-light);margin:0 0 1rem;font-size:.95rem;}
  .visitor-badge{opacity:.9;display:block;}

  main{max-width:920px;margin:0 auto;padding:2.4rem 1.5rem 4rem;}
  .list-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:.8rem;margin-bottom:1rem;}
  .list-head h2{font-family:'Fraunces',serif;font-size:1.3rem;margin:0;}
  .count{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:.82rem;}

  .card{display:block;background:#fff;border:1px solid var(--line);border-left:4px solid var(--panel);border-radius:4px;padding:1.1rem 1.3rem;margin-bottom:.9rem;transition:border-color .15s, transform .15s;}
  .card:hover{border-left-color:var(--gold);transform:translateX(2px);}
  .card.type-special{border-left-color:var(--rise);}
  .card-top{display:flex;gap:.7rem;align-items:baseline;flex-wrap:wrap;}
  .ticker{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--gold);font-size:.85rem;}
  .name{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:.85rem;}
  .badge{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:.7rem;padding:.15rem .5rem;border-radius:99px;background:var(--paper-2);color:var(--muted);}
  .badge.special{background:rgba(178,58,46,.12);color:var(--rise);}
  .title{font-family:'Fraunces',serif;font-size:1.15rem;margin:.4rem 0 .3rem;}
  .date{font-family:'IBM Plex Mono',monospace;font-size:.76rem;color:var(--muted-light);}
  .empty{color:var(--muted);font-size:.9rem;padding:2rem 0;}

  footer{background:var(--panel);color:var(--muted-light);padding:1.6rem 1.5rem;font-size:.8rem;text-align:center;font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="eyebrow">Stock Analysis Reports</div>
    <h1>個股分析報告</h1>
    <p>aimaster888 的台股個股分析報告總覽,依「股票第二種分析法(六步驟深度分析)」與其他分析法整理。</p>
    <img class="visitor-badge" src="https://visitor-badge.laobi.icu/badge?page_id=aimaster888.stock-analysis.index" alt="Visitors">
  </div>
</header>

<main>
  <div class="list-head">
    <h2>所有報告</h2>
    <span class="count" id="report-count"></span>
  </div>
  <div id="report-list"></div>
</main>

<footer>stock-analysis · aimaster888</footer>

<script>
  // 每次新增/更新報告時,在這個陣列新增或更新對應物件
  const REPORTS = [
    {
      ticker: "2330",
      name: "台積電",
      title: "台積電(2330) 六步驟深度分析報告",
      file: "reports/2330_tsmc_analysis.html",
      date: "2026-08-29",
      type: "analysis"
    }
  ];

  const list = document.getElementById('report-list');
  const countEl = document.getElementById('report-count');

  const sorted = [...REPORTS].sort((a, b) => b.date.localeCompare(a.date));
  countEl.textContent = sorted.length + ' 篇';

  if (sorted.length === 0) {
    list.innerHTML = '<div class="empty">目前還沒有報告。</div>';
  } else {
    list.innerHTML = sorted.map(r => `
      <a class="card ${r.type === 'special' ? 'type-special' : ''}" href="${r.file}">
        <div class="card-top">
          <span class="ticker">${r.ticker}</span>
          <span class="name">${r.name}</span>
          <span class="badge ${r.type === 'special' ? 'special' : ''}">${r.type === 'special' ? '特別事件' : '六步驟分析'}</span>
        </div>
        <div class="title">${r.title}</div>
        <div class="date">${r.date}</div>
      </a>
    `).join('');
  }
</script>

</body>
</html>
